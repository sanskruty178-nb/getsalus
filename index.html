<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GetSalus</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#060A0E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#060A0E;--card:rgba(255,255,255,.05);--ink:#EAF3F0;--mute:#8CA19A;--line:rgba(255,255,255,.1);--g:#2DE3A6;--cy:#38BDF8;--vi:#8B5CF6;--soft:rgba(45,227,166,.09);--acc:#FFB454;--grad:linear-gradient(135deg,#2DE3A6 0%,#38BDF8 60%,#8B5CF6 100%);--glow:0 0 28px rgba(45,227,166,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 18% 12%,rgba(45,227,166,.24),transparent 70%),radial-gradient(35% 35% at 88% 22%,rgba(139,92,246,.26),transparent 70%),radial-gradient(42% 42% at 58% 92%,rgba(56,189,248,.18),transparent 70%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(5%,4%,0) scale(1.1)}}
main{max-width:480px;margin:0 auto;padding:22px 18px 110px;min-height:100vh;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:Sora,Figtree,sans-serif;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h2{font-size:1.5rem;font-weight:800;margin-bottom:6px}h3{font-size:1.05rem;font-weight:600}
p{margin:0 0 12px}.mute{color:var(--mute)}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;padding:18px;margin-bottom:14px;animation:in .5s both}
button{font:600 1rem Figtree,sans-serif;border:0;border-radius:16px;padding:15px 18px;background:var(--grad);color:#04120C;width:100%;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:var(--glow)}
button:active{transform:scale(.97)}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button:disabled{opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.row2{display:flex;gap:10px}.row2 button{flex:1}
.hero{position:relative;background:linear-gradient(160deg,rgba(45,227,166,.16),rgba(139,92,246,.18));border:1px solid var(--line);border-radius:30px;padding:38px 22px;text-align:center;margin:8px 0 24px;box-shadow:var(--glow);overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;left:50%;top:50%;margin:-110px 0 0 -110px;border-radius:50%;border:1px solid rgba(45,227,166,.35);box-shadow:0 0 60px rgba(56,189,248,.25) inset;animation:pulse 3.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.55);opacity:.9}to{transform:scale(1.5);opacity:0}}
.hero .big{position:relative;z-index:1;font-size:4rem;display:block;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(45,227,166,.5))}
@keyframes fl{50%{transform:translateY(-10px)}}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:all .3s}.dots i.on{width:26px;background:var(--grad);box-shadow:var(--glow)}
.bar{height:6px;background:var(--line);border-radius:9px;margin-bottom:22px;overflow:hidden}.bar b{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .4s;box-shadow:var(--glow)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.chip{padding:11px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);width:auto;font-weight:500;transition:all .2s;box-shadow:none}
.chip.on{background:var(--grad);border-color:transparent;color:#04120C;transform:scale(1.04);box-shadow:var(--glow)}
input[type=text],textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);color:var(--ink);font:inherit;margin-top:6px}
input::placeholder,textarea::placeholder{color:var(--mute)}
.drop{display:block;background:linear-gradient(160deg,rgba(45,227,166,.08),rgba(56,189,248,.08));border:1.5px dashed rgba(45,227,166,.55);border-radius:26px;padding:46px 16px;text-align:center;cursor:pointer;margin:18px 0;transition:transform .2s,box-shadow .2s;box-shadow:var(--glow)}
.drop:active{transform:scale(.98)}.drop .em{font-size:3rem;display:block}.drop b{font:800 1.2rem Sora,sans-serif}
.drop input{display:none}
img.shot{width:100%;max-height:250px;object-fit:cover;border-radius:22px;display:block;margin-bottom:14px;border:1px solid var(--line)}
.scanbox{position:relative;overflow:hidden;border-radius:22px;margin-bottom:14px}.scanbox img.shot{margin:0}
.beam{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#2DE3A6,#38BDF8,transparent);box-shadow:0 0 26px 8px rgba(45,227,166,.55);animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.load{text-align:center;padding:18px}.ring{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.08);border-top-color:var(--g);border-right-color:var(--cy);margin:0 auto 12px;animation:sp .9s linear infinite;box-shadow:var(--glow)}
@keyframes sp{to{transform:rotate(360deg)}}
.ai{display:inline-block;font-size:.76rem;font-weight:600;color:var(--g);background:var(--soft);border:1px solid rgba(45,227,166,.35);border-radius:99px;padding:3px 11px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{display:block;color:var(--mute);font-size:.8rem}.stat b{font-size:1.05rem;color:var(--g)}
.note{border-left:3px solid var(--g);padding:2px 0 2px 12px;margin:12px 0}.note.imp{border-color:var(--acc)}
.adds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.add{background:rgba(255,255,255,.04);border:1px solid rgba(45,227,166,.3);border-radius:16px;padding:14px 4px;text-align:center;font-weight:600;font-size:.92rem;animation:pop .5s both;box-shadow:0 0 18px rgba(45,227,166,.1)}.add i{display:block;font-style:normal;font-size:2rem}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.err{color:#FF7A6B;font-weight:500}
.hist{display:flex;gap:14px;align-items:center;text-align:left;background:none;color:var(--ink);padding:0;box-shadow:none}.hist img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.prem{background:linear-gradient(#0B1218,#0B1218) padding-box,var(--grad) border-box;border:1.5px solid transparent}.prem li{margin:6px 0}.prem ul{padding-left:20px;margin:10px 0 16px}
.tag{display:inline-block;background:var(--acc);color:#1A1000;border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:600;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:480px;width:100%;background:rgba(14,22,28,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:6px}
nav button{background:none;color:var(--mute);padding:10px 4px;font-size:.82rem;border-radius:18px;box-shadow:none}nav button span{display:block;font-size:1.3rem}
nav button.on{background:var(--soft);color:var(--g);box-shadow:inset 0 0 0 1px rgba(45,227,166,.35)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<form name="feedback" data-netlify="true" hidden><input name="type"><textarea name="message"></textarea><input name="contact"></form>
<form name="rating" data-netlify="true" hidden><input name="helpful"><input name="meal"></form>
<form name="waitlist" data-netlify="true" hidden><input name="contact"><input name="plan"></form>
<main id="app"></main>
<nav id="nav" hidden><div><button data-t="snap"><span>📸</span>Snap</button><button data-t="hist"><span>🍽️</span>Meals</button><button data-t="me"><span>👤</span>You</button></div></nav>
<script>
var app=document.getElementById('app'),nav=document.getElementById('nav'),LIM=5;
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var P=ld('gs_profile',null),M=ld('gs_meals',[]),busy=false;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function view(h){app.style.animation='none';void app.offsetHeight;app.style.animation='';app.innerHTML=h;window.scrollTo(0,0)}
function post(n,d){return fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({'form-name':n},d)).toString()})}
function today(){return new Date().toISOString().slice(0,10)}
function used(){var u=ld('gs_use',{});return u.d===today()?u.n:0}
function chips(opts,sel){return '<div class="chips">'+opts.map(function(o){return '<button type="button" class="chip'+(sel.indexOf(o)>-1?' on':'')+'" data-v="'+o+'">'+o+'</button>'}).join('')+'</div>'}

/* intro */
var SL=[{e:'📸',t:'Snap your meal',d:'Take a photo of anything you eat. No typing, no counting.'},{e:'🧠',t:'Understand it',d:'GetSalus tells you in plain words what the meal gives you, for you.'},{e:'🌱',t:'Improve it',d:'Get 3 simple things to add, based on how you actually eat.'}];
function intro(i){var s=SL[i],last=i===SL.length-1;
 view('<div class="hero"><span class="big">'+s.e+'</span></div><h1 class="center">'+s.t+'</h1><p class="mute center" style="margin-top:12px">'+s.d+'</p><div class="dots">'+SL.map(function(_,j){return '<i class="'+(j===i?'on':'')+'"></i>'}).join('')+'</div><button id="nx">'+(last?'Get started':'Next')+'</button>'+(last?'':'<button class="ghost" id="sk" style="margin-top:10px">Skip</button>'));
 nav.hidden=true;document.getElementById('nx').onclick=function(){last?done():intro(i+1)};var k=document.getElementById('sk');if(k)k.onclick=done;
 function done(){sv('gs_intro',1);P?show('snap'):ob(0,{})}}

/* onboarding */
var ST=[{k:'diet',q:'How do you eat?',o:['Vegetarian','Eggs ok','Non-vegetarian','Vegan']},
{k:'allergies',q:'Any allergies or foods to avoid?',o:['None','Peanuts','Dairy','Gluten','Eggs','Soy','Shellfish','Tree nuts'],multi:1,text:'Anything else? (optional)'},
{k:'goal',q:'What matters most to you?',o:['Eat balanced','More protein','More energy','Gentler on stomach']},
{k:'cuisine',q:'What do you usually eat?',o:['North Indian','South Indian','Gujarati','Bengali','Mixed / other'],text:'Your usual foods (optional)'}];
function ob(i,d){var s=ST[i],sel=[].concat(d[s.k]||[]);nav.hidden=true;
 view('<div class="bar"><b style="width:'+((i+1)/ST.length*100)+'%"></b></div><p class="mute">Step '+(i+1)+' of '+ST.length+'</p><h2>'+s.q+'</h2>'+chips(s.o,sel)+(s.text?'<input type="text" id="tx" placeholder="'+s.text+'" value="'+esc(d[s.k+'_t']||'')+'">':'')+'<p id="oe" class="err"></p><div class="row2" style="margin-top:14px">'+(i?'<button class="ghost" id="bk">Back</button>':'')+'<button id="nx">'+(i===ST.length-1?'Finish':'Next')+'</button></div>');
 app.onclick=function(e){var c=e.target.closest('.chip');if(!c)return;var v=c.dataset.v;
  if(s.multi){if(v==='None')sel=['None'];else{sel=sel.filter(function(x){return x!=='None'});var j=sel.indexOf(v);j>-1?sel.splice(j,1):sel.push(v)}}else sel=[v];
  d[s.k]=sel;Array.prototype.forEach.call(app.querySelectorAll('.chip'),function(x){x.classList.toggle('on',sel.indexOf(x.dataset.v)>-1)})};
 document.getElementById('nx').onclick=function(){var t=document.getElementById('tx');if(t)d[s.k+'_t']=t.value.trim();
  if(!(d[s.k]||[]).length){document.getElementById('oe').textContent='Please pick an option.';return}
  if(i<ST.length-1)ob(i+1,d);else{P={diet:d.diet[0],allergies:d.allergies.join(', ')+(d.allergies_t?', '+d.allergies_t:''),goal:d.goal[0],cuisine:d.cuisine[0],foods:d.cuisine_t||''};sv('gs_profile',P);app.onclick=null;show('snap')}};
 var b=document.getElementById('bk');if(b)b.onclick=function(){ob(i-1,d)}}

/* shell */
function show(t){app.onclick=null;if(!P){ld('gs_intro',0)?ob(0,{}):intro(0);return}nav.hidden=false;
 Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.t===t)});
 ({snap:snapV,hist:histV,me:meV})[t]()}
nav.onclick=function(e){var b=e.target.closest('button');if(b)show(b.dataset.t)};

/* snap */
function snapV(){var left=Math.max(0,LIM-used());
 view('<h2>Snap your meal</h2><p class="mute">'+left+' of '+LIM+' free analyses left today.</p><label class="drop"><span class="em">🍛</span><b>Photograph your plate</b><span class="mute">Camera or gallery</span><input type="file" id="file" accept="image/*"></label><div id="out"></div>');
 document.getElementById('file').onchange=function(e){var f=e.target.files[0];if(f)analyse(f)}}
function img(file,m,q){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=u})}
async function ask(b64){var resp=await fetch('/.netlify/functions/analyse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,profile:P})});var r;try{r=await resp.json()}catch(e){r={error:'Server took too long ('+resp.status+').'}}r._s=resp.status;return r}
async function analyse(file){if(busy)return;var out=document.getElementById('out');
 if(used()>=LIM){out.innerHTML=premCard('You have used today\'s free analyses.');wl();return}
 busy=true;var url=URL.createObjectURL(file),msgs=['Reading your plate…','Spotting the dishes…','Checking what it gives you…','Thinking about you…'],n=0;
 out.innerHTML='<div class="scanbox"><img class="shot" src="'+url+'" alt="Your meal"><span class="beam"></span></div><div class="load"><div class="ring"></div><p class="mute" id="lm">'+msgs[0]+'</p></div>';
 var iv=setInterval(function(){var l=document.getElementById('lm');if(l)l.textContent=msgs[++n%msgs.length]},1800);
 try{var b64=(await img(file,800,.7)).split(',')[1],r=await ask(b64);
  if(r.error&&r._s>=500){await new Promise(function(z){setTimeout(z,1500)});r=await ask(b64)}
  clearInterval(iv);
  if(r.error){out.innerHTML='<img class="shot" src="'+url+'" alt="Your meal"><p class="err">'+esc(r.error)+'</p><button class="ghost" onclick="snapV()">Try again</button>';busy=false;return}
  var th=await img(file,200,.6);M.unshift({t:Date.now(),th:th,r:r});M=M.slice(0,30);sv('gs_meals',M);sv('gs_use',{d:today(),n:used()+1});
  out.innerHTML='<img class="shot" src="'+url+'" alt="Your meal">'+result(r)+rate(r)+'<button class="ghost" onclick="snapV()" style="margin-top:6px">Snap another meal</button>';
  wire(r)}catch(e){clearInterval(iv);out.innerHTML='<p class="err">Could not read this photo. Check your connection and try again.</p><button class="ghost" onclick="snapV()">Try again</button>'}
 busy=false}
function result(r){var a=(r.additions||[]).slice(0,3);
 return '<div class="card"><span class="ai">✦ AI analysis</span><br><h3>'+esc(r.meal)+'</h3><div class="stats"><div class="stat"><small>Protein</small><b>~'+esc(r.protein_g)+' g</b></div><div class="stat"><small>Energy</small><b>~'+esc(r.energy_kcal)+' kcal</b></div><div class="stat"><small>Fibre</small><b>'+esc(r.fibre)+'</b></div><div class="stat"><small>Key nutrients</small><b>'+esc((r.key_nutrients||[]).join(', '))+'</b></div></div><div class="note"><b>Good</b><br>'+esc(r.good)+'</div><div class="note imp"><b>Could improve</b><br>'+esc(r.improve)+'</div></div><div class="card" style="animation-delay:.15s"><h3>What should I add?</h3><div class="adds">'+a.map(function(x,i){return '<div class="add" style="animation-delay:'+(.3+i*.15)+'s"><i>'+esc(x.emoji)+'</i>'+esc(x.name)+'</div>'}).join('')+'</div></div>'}
function rate(){return '<div class="card" id="rt" style="animation-delay:.3s"><p><b>Was this helpful?</b></p><div class="row2"><button class="ghost" data-h="yes">👍 Yes</button><button class="ghost" data-h="no">👎 Not really</button></div></div>'}
function wire(r){var c=document.getElementById('rt');c.onclick=function(e){var b=e.target.closest('button');if(!b)return;post('rating',{helpful:b.dataset.h,meal:r.meal}).catch(function(){});c.innerHTML='<p class="center"><b>Thanks! It helps us improve 💚</b></p>'}}

/* history */
function histV(){
 if(!M.length){view('<h2>Your meals</h2><p class="mute">No meals yet. Snap your first plate and it shows up here.</p><button id="g">Snap a meal</button>');document.getElementById('g').onclick=function(){show('snap')};return}
 view('<h2>Your meals</h2>'+M.map(function(m,i){return '<div class="card" style="animation-delay:'+Math.min(i,6)*.05+'s"><button class="hist" data-i="'+i+'"><img src="'+m.th+'" alt=""><span><b>'+esc(m.r.meal)+'</b><br><small class="mute">'+new Date(m.t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</small></span></button></div>'}).join(''));
 app.onclick=function(e){var b=e.target.closest('[data-i]');if(!b)return;var m=M[b.dataset.i];app.onclick=null;
  view('<button class="ghost" id="bk" style="margin-bottom:14px">Back to meals</button><img class="shot" src="'+m.th+'" alt="">'+result(m.r));document.getElementById('bk').onclick=histV}}

/* you / premium / feedback */
function premCard(t){return '<div class="card prem"><span class="tag">Premium · coming soon</span><h3>'+t+'</h3><ul><li>Unlimited meal analyses</li><li>Weekly insights on how you eat</li><li>Deeper personal suggestions</li><li>Meal history across all your devices</li></ul><input type="text" id="wc" placeholder="Email or phone (optional)"><button id="wb" style="margin-top:12px">Join the waitlist</button></div>'}
function wl(){var b=document.getElementById('wb');if(!b)return;b.onclick=function(){post('waitlist',{contact:document.getElementById('wc').value,plan:'premium'}).catch(function(){});b.parentNode.innerHTML='<h3>You are on the list 🎉</h3><p>We will let you know when Premium opens.</p>'}}
function meV(){
 view('<h2>You</h2><div class="card"><h3>Your preferences</h3><p class="mute" style="margin-top:8px">'+esc(P.diet)+' · '+esc(P.goal)+'<br>Avoids: '+esc(P.allergies)+'<br>Cuisine: '+esc(P.cuisine)+'</p><button class="ghost" id="ed">Edit preferences</button></div>'+premCard('Unlock more with Premium')+'<button class="ghost" id="fb" style="margin-bottom:10px">💬 Send feedback</button><button class="ghost" id="rs">Reset all my data</button><p class="mute center" style="margin-top:16px;font-size:.85rem">Your preferences and meals are saved on this device only.</p>');
 wl();document.getElementById('ed').onclick=function(){ob(0,{})};document.getElementById('fb').onclick=fbV;
 document.getElementById('rs').onclick=function(){if(confirm('Delete your preferences and meal history from this device?')){try{localStorage.clear()}catch(e){}P=null;M=[];intro(0)}}}
function fbV(){var t='Idea';
 view('<button class="ghost" id="bk" style="margin-bottom:14px">Back</button><h2>Tell us what you think</h2><p class="mute">Ideas, problems, or things you love. We read everything.</p>'+chips(['Idea','Problem','Love it'],['Idea'])+'<textarea id="msg" rows="5" placeholder="Your message"></textarea><input type="text" id="ct
